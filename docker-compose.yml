services:
  mysql:
    image: mysql:8.4
    container_name: warehouse-dashboard-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: warehouse_dashboard
      MYSQL_USER: warehouse
      MYSQL_PASSWORD: warehouse123
      MYSQL_ROOT_PASSWORD: root123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - warehouse_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  warehouse_mysql_data:
