server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/css,application/javascript

spring:
  datasource:
    url: ${WAREHOUSE_DB_URL:jdbc:mysql://127.0.0.1:3306/warehouse_dashboard?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${WAREHOUSE_DB_USERNAME:warehouse}
    password: ${WAREHOUSE_DB_PASSWORD:warehouse123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

warehouse:
  cors-origins: http://127.0.0.1:5173,http://localhost:5173
  seed-enabled: ${WAREHOUSE_SEED_ENABLED:true}
