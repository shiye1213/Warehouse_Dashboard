server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/css,application/javascript

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

warehouse:
  cors-origins: http://127.0.0.1:5173,http://localhost:5173
